<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmarker</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <div class="nav-columns" id="nav-columns"></div>
    <main class="main">
      <header class="main-header">
        <div class="main-header-row">
          <h2 id="list-title">Inbox</h2>
          <div class="main-header-actions">
            <button type="button" id="add-bookmark" class="header-btn">Add bookmark</button>
            <button type="button" id="edit-toggle" class="edit-toggle" aria-pressed="false">Edit</button>
          </div>
        </div>
        <p class="hint">Drag bookmarks onto a category or folder; drag a category onto a folder to refile it.</p>
      </header>
      <div class="bookmark-scroll">
        <ul id="bookmark-list" class="bookmarks"></ul>
        <p id="empty" class="empty hidden">No bookmarks here yet.</p>
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
